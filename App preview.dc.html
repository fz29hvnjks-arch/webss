<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="page-extras.js"></script>
<style>* { box-sizing: border-box; } body { margin: 0; }</style>
</helmet>
<div data-theme="{{ themeName }}" style="min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font)">

  <nav style="display:flex;align-items:center;gap:28px;padding:16px 32px;border-bottom:2px solid var(--divider)">
    <div style="font-weight:800;font-size:18px;margin-right:auto">Halcyon</div>
    <a href="Dashboard.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">Dashboard</a>
    <a href="Calendar.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">Calendar</a>
    <a href="Budget.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">Budget</a>
    <a href="University.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">University</a>
    <a href="Health.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">Health</a>
    <a href="Trophies.dc.html" style="color:var(--text);text-decoration:none;font-size:14px">Trophies</a>
    <a href="App preview.dc.html" aria-current="page" style="color:var(--accent);text-decoration:none;font-size:14px;font-weight:600">App preview</a>
    <select value="{{ themeName }}" onChange="{{ setTheme }}" style="font-family:var(--font);font-size:12px;padding:6px 10px;background:var(--surface);color:var(--text);border:1px solid var(--divider);border-radius:8px;cursor:pointer"><sc-for list="{{ themeOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select>
    
  </nav>

  <div style="padding:32px 32px 12px">
    <h1 style="margin:0 0 4px;font-size:32px">One app, every screen</h1>
    <div style="font-size:14px;opacity:0.6;max-width:560px">The same Halcyon dashboard adapts from your desktop to your phone — full grid on the big screen, a single tidy column in your pocket.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button data-page="{{ t.page }}" onClick="{{ setPage }}" style="font-family:var(--font);font-weight:800;font-size:13px;padding:9px 18px;cursor:pointer;background:{{ t.bg }};color:{{ t.color }};border:1px solid var(--divider)">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-end;padding:32px 40px 80px;justify-content:center">

    <!-- Laptop -->
    <div>
      <div style="width:820px;max-width:88vw;background:var(--text);border-radius:16px 16px 0 0;padding:12px">
        <div style="display:flex;gap:7px;margin-bottom:10px">
          <div style="width:11px;height:11px;border-radius:50%;background:var(--accent)"></div>
          <div style="width:11px;height:11px;border-radius:50%;background:var(--muted)"></div>
          <div style="width:11px;height:11px;border-radius:50%;background:var(--muted)"></div>
        </div>
        <div style="width:100%;height:500px;overflow:hidden;background:var(--bg)">
          <iframe src="{{ page }}" title="desktop" style="width:1400px;height:875px;border:none;transform:scale(0.5714);transform-origin:top left"></iframe>
        </div>
      </div>
      <div style="height:14px;background:var(--text);border-radius:0 0 4px 4px"></div>
      <div style="width:180px;height:10px;background:var(--text);margin:0 auto;border-radius:0 0 10px 10px"></div>
      <div style="text-align:center;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.5;margin-top:14px">On your PC</div>
    </div>

    <!-- Phone -->
    <div>
      <div style="width:300px;background:var(--text);border-radius:40px;padding:12px">
        <div style="position:relative;background:var(--bg);border-radius:30px;overflow:hidden;height:620px">
          <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:var(--text);border-radius:0 0 14px 14px;z-index:2"></div>
          <iframe src="{{ page }}" title="phone" style="width:375px;height:775px;border:none;transform:scale(0.7573);transform-origin:top left"></iframe>
        </div>
      </div>
      <div style="text-align:center;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.5;margin-top:14px">In your pocket</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function loadTheme(){try{return localStorage.getItem('halcyon-theme')||'mutedred';}catch(x){return 'mutedred';}}
function saveTheme(k){try{localStorage.setItem('halcyon-theme',k);}catch(x){}}
var _optCache = {};
function orderThemes(name){ if (_optCache[name]) return _optCache[name]; var a = THEME_OPTIONS.slice(); var i = a.findIndex(function(o){return o.value===name;}); if (i > 0) a.unshift(a.splice(i,1)[0]); _optCache[name] = a; return a; }
const THEME_OPTIONS = [{"value":"modernist","label":"Modernist"},{"value":"peach","label":"Peach fruity"},{"value":"mutedred","label":"Muted red"},{"value":"planets","label":"Planets"},{"value":"sunshine","label":"Sunshine"},{"value":"disco","label":"Disco 54"},{"value":"speakeasy","label":"Speakeasy 20s"},{"value":"neon80s","label":"80s Neon"},{"value":"havana","label":"Havana Nights"},{"value":"tropicana","label":"Club Tropicana"},{"value":"winter","label":"Winter Wonderland"},{"value":"coquette","label":"Coquette"},{"value":"cleangirl","label":"Clean Girl"},{"value":"celestial","label":"Celestial"},{"value":"teddycafe","label":"Teddy Caf\u00e9"},{"value":"mermaid","label":"Mermaidcore"},{"value":"tomatogirl","label":"Tomato Girl"},{"value":"diner","label":"Diner Doodle"},{"value":"breakfast","label":"Breakfast Club"},{"value":"chili70s","label":"70s Chili"},{"value":"happyhour","label":"Happy Hour"},{"value":"bauhaus","label":"Bauhaus Grid"},{"value":"quiet","label":"Quiet (calm)"},{"value":"oat","label":"Oat (calm)"},{"value":"still","label":"Still (calm)"},{"value":"dim","label":"Dim (calm dark)"},{"value":"w0","label":"Paper"},{"value":"w1","label":"Snow"},{"value":"w2","label":"Cloud"},{"value":"w3","label":"Mono"},{"value":"w4","label":"Mist"},{"value":"g0","label":"Dusty Brick"},{"value":"g1","label":"Faded Jade"},{"value":"g2","label":"Soft Iris"},{"value":"g3","label":"Deep Ochre"},{"value":"g4","label":"Pale Teal"},{"value":"g5","label":"Warm Blush"},{"value":"g6","label":"Cool Fern"},{"value":"g7","label":"Muted Denim"},{"value":"g8","label":"Antique Terracotta"},{"value":"g9","label":"Vintage Jade"},{"value":"g10","label":"Quiet Plum"},{"value":"g11","label":"Dusty Ochre"},{"value":"g12","label":"Faded Lagoon"},{"value":"g13","label":"Soft Brick"},{"value":"g14","label":"Deep Fern"},{"value":"g15","label":"Pale Iris"},{"value":"g16","label":"Warm Terracotta"},{"value":"g17","label":"Cool Teal"},{"value":"g18","label":"Muted Blush"},{"value":"g19","label":"Antique Olive"},{"value":"g20","label":"Vintage Denim"},{"value":"g21","label":"Quiet Brick"},{"value":"g22","label":"Dusty Jade"},{"value":"g23","label":"Faded Iris"},{"value":"g24","label":"Soft Ochre"},{"value":"g25","label":"Deep Lagoon"},{"value":"g26","label":"Pale Blush"},{"value":"g27","label":"Warm Fern"},{"value":"g28","label":"Cool Denim"},{"value":"g29","label":"Muted Terracotta"},{"value":"g30","label":"Antique Teal"},{"value":"g31","label":"Vintage Plum"},{"value":"g32","label":"Quiet Olive"},{"value":"g33","label":"Dusty Lagoon"},{"value":"g34","label":"Faded Brick"},{"value":"g35","label":"Soft Fern"},{"value":"g36","label":"Deep Iris"},{"value":"g37","label":"Pale Ochre"},{"value":"g38","label":"Warm Teal"},{"value":"g39","label":"Cool Blush"},{"value":"g40","label":"Muted Olive"},{"value":"g41","label":"Antique Denim"},{"value":"g42","label":"Vintage Terracotta"},{"value":"g43","label":"Quiet Jade"},{"value":"g44","label":"Dusty Plum"},{"value":"g45","label":"Faded Ochre"},{"value":"g46","label":"Soft Lagoon"}];

const TABS = [
  { label: 'Dashboard', page: 'Dashboard.dc.html' },
  { label: 'Calendar', page: 'Calendar.dc.html' },
  { label: 'Budget', page: 'Budget.dc.html' },
  { label: 'University', page: 'University.dc.html' },
];

class Component extends DCLogic {
  state = { page: 'Dashboard.dc.html', theme: loadTheme() };

  setPage = (e) => this.setState({ page: e.currentTarget.dataset.page });

  setTheme = (e) => { const v = e.currentTarget.value; saveTheme(v); this.setState({ theme: v }); };

  cycleTheme = () => { var list = THEME_OPTIONS; var cur = this.state.theme; var i = list.findIndex(function(o){return o.value===cur;}); var next = list[(i+1)%list.length].value; saveTheme(next); this.setState({ theme: next }); };


  renderVals() {
    const tabs = TABS.map(t => ({
      ...t,
      bg: t.page === this.state.page ? 'var(--accent)' : 'transparent',
      color: t.page === this.state.page ? 'var(--bg)' : 'var(--text)',
    }));
    const themeName = this.state.theme;
    const themeOptions = orderThemes(themeName);
    return { tabs, page: this.state.page, setPage: this.setPage, themeName, themeOptions, setTheme: this.setTheme, themeLabel: (THEME_OPTIONS.find(function(o){return o.value===themeName;})||{}).label || themeName, cycleTheme: this.cycleTheme, };
  }
}
</script>
</body>
</html>
